<!DOCTYPE html>
<html>
<head>
    <title>Job Openings</title>

    <style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #eef2f3, #ffffff);
    margin: 0;
}

.container {
    width: 80%;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 20px;
    margin: 20px 0;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.btn {
    padding: 10px 18px;
    border-radius: 6px;
    text-decoration: none;
    color: white;
    font-weight: bold;
}

.btn-blue {
    background: linear-gradient(45deg, #007bff, #00c6ff);
}

.btn-green {
    background: linear-gradient(45deg, #28a745, #5cd65c);
}

.btn-red {
    background: linear-gradient(45deg, #dc3545, #ff6b6b);
}

.top-box {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
}
</style>
</head>

<body>
<div class="container">

    <h1>Job Openings</h1>

    <div class="top-box">
        <a href="/selected/" class="btn btn-green">View Selected Candidates</a>
        <a href="/rejected/" class="btn btn-red">View Rejected Candidates</a>
    </div>

    {% for job in jobs %}
    <div class="card">
        <h2>{{ job.title }}</h2>
        <p>{{ job.skills }}</p>
        <p>{{ job.experience }}</p>

        <a href="/apply/{{ job.id }}/" class="btn btn-blue">Apply</a>
    </div>
    {% endfor %}

</div>
</body>
</html>
