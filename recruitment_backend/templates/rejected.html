<!DOCTYPE html>
<html>
<head>
    <title>Rejected Candidates</title>

    <style>
        body { font-family: Arial; background: #f5f5f5; }
        .container { width: 80%; margin: auto; }
        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>
<div class="container">

<h1>Rejected Candidates</h1>

<a href="/">← Back to Jobs</a>

{% for app in applications %}
<div class="card">
    <h3>{{ app.name }}</h3>
    <p>Email: {{ app.email }}</p>
    <p>Job: {{ app.job.title }}</p>
    <p>Score: {{ app.score }}</p>
</div>
{% empty %}
<p>No rejected candidates</p>
{% endfor %}

</div>
</body>
</html>
